[package]
name = "nrev"
version = "0.7.0"
edition = "2024"
authors = ["shellrow <shellrow@foctal.com>"]
description = "Cross-platform network mapper for discovery and probing."
repository = "https://github.com/shellrow/nrev"
homepage = "https://github.com/shellrow/nrev"
documentation = "https://github.com/shellrow/nrev"
readme = "README.md"
keywords = ["network","security","scan","cli","cross-platform"]
categories = ["network-programming"]
license = "MIT"

[dependencies]
anyhow = { version = "1" }
async-trait = "0.1"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["time", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
netdev = { version = "0.41", features = ["serde"] }
nex = { version = "0.26", features = ["serde"] }
futures = {version = "0.3", features = ["executor", "thread-pool"]}
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.7"
rustls-pki-types = "1.8"
x509-parser = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] } 
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
clap = { version = "4.5", features = ["derive", "cargo"] }
ipnet = "2.11"
termtree = "0.5"
regex = "1.11"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3"
bytes = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
