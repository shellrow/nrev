[package]
name = "nrev"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["shellrow <shellrow@foctal.com>"]
description = "Cross-platform network mapper for discovery and probing."
repository = "https://github.com/shellrow/nrev"
homepage = "https://github.com/shellrow/nrev"
documentation = "https://github.com/shellrow/nrev"
readme = "README.md"
keywords = ["network", "security", "scan", "cli", "cross-platform"]
categories = ["network-programming"]
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["time", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
netdev = { version = "0.46.0", features = ["serde"] }
nex = { version = "0.27.0", features = ["async", "serde"] }
futures = "0.3.34"
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"
x509-parser = "0.18.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.0"
clap = { version = "4.6.6", features = ["derive", "cargo"] }
ipnet = "2.12.1"
termtree = "1.0.0"
regex = "1.13.1"
quinn = "0.11.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
bytes = "1.12.1"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
